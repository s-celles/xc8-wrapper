remote_theme: just-the-docs/just-the-docs

title: XC8 Wrapper
description: Modern, secure, cross-platform wrapper for Microchip XC8 compiler

url: https://s-celles.github.io
baseurl: /xc8-wrapper

# Logo and favicon
logo: "/assets/images/logo.png"
favicon_ico: "/assets/images/favicon.ico"

# Navigation
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/s-celles/xc8-wrapper
  - title: PyPI Package
    url: https://pypi.org/project/xc8-wrapper/

# Search configuration
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true

# Aux links for the upper right navigation
aux_links:
  "XC8 Wrapper on GitHub": "https://github.com/s-celles/xc8-wrapper"

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: true

# Theme settings
color_scheme: light

# Footer content
footer_content: 'Copyright &copy; 2025 Sébastien Celles. Licensed under the <a href="https://github.com/s-celles/xc8-wrapper/blob/main/LICENSE">MIT License</a>.'

# Enable or disable heading anchors
heading_anchors: true

# Collections for organizing content
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Default values for front matter
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: "default"
      nav_order: 1
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-seo-tag

# Kramdown settings
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from build
exclude:
  - node_modules/
  - "*.gemspec"
  - "*.gem"
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - script/
  - LICENSE.txt
  - lib/
  - bin/
  - Rakefile
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - .DS_Store
