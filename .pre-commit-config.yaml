repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
        additional_dependencies: [types-colorama, typer, colorama, logbook]
        #args: [--no-strict-optional, --allow-untyped-defs, --disable-error-code=misc]
        #exclude: ^(tests/|setup_dev\.py|run_tests\.py|demo\.py|diagnose_platform\.py|install_xc8\.py)

  - repo: https://github.com/pycqa/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-r, xc8_wrapper/]
        exclude: tests/

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen-branch
        stages: [pre-push]
        additional_dependencies: [
          pytest>=7.0,
          pytest-cov>=4.0,
          colorama>=0.4.4,
          logbook>=1.5.3
        ]

  # Temporarily disabled safety check due to configuration issues
  # - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
  #   rev: v1.4.2
  #   hooks:
  #     - id: python-safety-dependencies-check
