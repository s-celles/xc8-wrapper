[tox]
envlist = py38,py39,py310,py311,py312,flake8,mypy,black,isort,safety
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov>=4.0
    pytest-xdist>=3.0
commands =
    pytest {posargs:tests/}

[testenv:flake8]
deps = flake8>=4.0
commands = flake8 xc8_wrapper tests

[testenv:mypy]
deps =
    mypy>=0.910
    types-colorama
commands = mypy xc8_wrapper --ignore-missing-imports

[testenv:black]
deps = black>=22.0
commands = black --check --diff xc8_wrapper tests

[testenv:isort]
deps = isort>=5.0
commands = isort --check-only --diff xc8_wrapper tests

[testenv:safety]
deps = safety
commands = safety check

[testenv:coverage]
deps =
    pytest>=7.0
    pytest-cov>=4.0
commands =
    pytest --cov=xc8_wrapper --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=80

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build -b html docs docs/_build

[flake8]
max-line-length = 127
extend-ignore = E203
exclude = .git,__pycache__,docs,old,build,dist,.venv,venv
