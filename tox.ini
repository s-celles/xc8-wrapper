[tox]
envlist = py38,py39,py310,py311,py312,ruff,mypy,safety
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov>=4.0
    pytest-xdist>=3.0
commands =
    pytest {posargs:tests/}

[testenv:ruff]
deps = ruff>=0.8.0
commands =
    ruff check xc8_wrapper tests
    ruff format --check xc8_wrapper tests

[testenv:mypy]
deps =
    mypy>=0.910
    types-colorama
commands = mypy xc8_wrapper --ignore-missing-imports

[testenv:safety]
deps = safety
commands = safety check

[testenv:coverage]
deps =
    pytest>=7.0
    pytest-cov>=4.0
commands =
    pytest --cov=xc8_wrapper --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=78

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build -b html docs docs/_build
