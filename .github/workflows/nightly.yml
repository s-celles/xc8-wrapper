name: Nightly Tests

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  extended-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows first (primary development platform), then Linux, then macOS
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        include:
          # Test development Python versions
          - os: ubuntu-latest
            python-version: '3.13-dev'
          - os: ubuntu-latest
            python-version: 'pypy-3.8'
          - os: ubuntu-latest
            python-version: 'pypy-3.9'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Run comprehensive tests
      run: |
        pytest tests/ -v --cov=xc8_wrapper --cov-report=xml --cov-report=term-missing
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Run performance tests
      run: |
        pytest tests/test_performance.py -v
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Run compatibility tests
      run: |
        pytest tests/test_compatibility.py -v
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Run stress tests
      run: |
        pytest tests/ -v --count=5  # Run tests 5 times to catch intermittent issues
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Test with different locales
      if: matrix.os != 'windows-latest'
      run: |
        # Test with different locales to catch encoding issues
        LC_ALL=C pytest tests/ -v
        LC_ALL=en_US.UTF-8 pytest tests/ -v

    - name: Memory leak test
      run: |
        python -c "
        import gc
        from xc8_wrapper.core import get_xc8_tool_path

        # Run operations many times to check for memory leaks
        for i in range(10000):
            path, version = get_xc8_tool_path('cc', version='3.00')
            if i % 1000 == 0:
                gc.collect()

        print('Memory leak test completed successfully')
        "
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: nightly
        name: codecov-nightly-${{ matrix.os }}-${{ matrix.python-version }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep

    - name: Run safety check
      run: |
        safety check --json

    - name: Run bandit security linter
      run: |
        bandit -r xc8_wrapper/ -f json

    - name: Run semgrep security scan
      run: |
        semgrep --config=auto xc8_wrapper/

  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Check for vulnerabilities in dependencies
      run: |
        pip-audit --desc --format=json

  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine check-manifest

    - name: Check manifest
      run: |
        check-manifest

    - name: Build package
      run: |
        python -m build

    - name: Check built package
      run: |
        twine check dist/*

    - name: Test installation from wheel
      run: |
        pip install dist/*.whl
        python -c "import xc8_wrapper; print(xc8_wrapper.__version__)"

  documentation-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Test demo script
      run: |
        python demo.py

    - name: Check README rendering
      run: |
        python -c "
        import markdown
        with open('README.md', 'r') as f:
            content = f.read()
        html = markdown.markdown(content)
        print('README.md renders correctly')
        "

  notification:
    runs-on: ubuntu-latest
    needs: [extended-tests, security-scan, dependency-check, build-test, documentation-test]
    if: failure()
    steps:
    - name: Notify on failure
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Nightly Tests Failed',
            body: 'The nightly tests have failed. Please check the workflow results.',
            labels: ['bug', 'ci-failure']
          });
