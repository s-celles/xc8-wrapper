name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows first (primary development platform), then Linux, then macOS
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        exclude:
          # Reduce the matrix size by excluding some combinations
          - os: macos-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.13'
        include:
          # Mark macOS as experimental - allowed to fail
          - os: macos-latest
            experimental: true

    # Allow macOS jobs to fail without affecting CI status
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
    - uses: actions/checkout@v4

    - name: Mark experimental platform
      if: matrix.experimental == true
      run: |
        echo "::warning::Running on experimental platform (macOS) - failures are allowed"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup environment (macOS)
      if: runner.os == 'macOS'
      run: |
        # Setup UTF-8 locale for macOS (experimental platform)
        echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV
        echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
        # Check locale
        locale
        # Check Python version and encoding
        python --version
        python -c "import sys; print('Default encoding:', sys.getdefaultencoding())"
        python -c "import locale; print('Locale:', locale.getdefaultlocale())"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget expect

    - name: Check and install XC8 if needed (Linux)
      if: runner.os == 'Linux'
      run: |
        xc8-wrapper install --check || xc8-wrapper install --version 3.00
      env:
        INSTALL_XC8: "true"
      continue-on-error: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Force reinstall of setuptools to avoid macOS issues
        python -m pip install --upgrade setuptools wheel
        # Install specific ruff version for consistency
        pip install ruff==0.12.3
        # Install package with verbose output to debug any issues
        pip install -e .[dev] -v
      env:
        # Fix encoding issues on all platforms
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1
        # Additional environment variables for macOS
        LC_ALL: en_US.UTF-8
        LANG: en_US.UTF-8

    - name: Run platform diagnostics
      run: |
        python -c "import platform; import sys; print(f'Platform: {platform.platform()}'); print(f'Python: {sys.version}'); print(f'Encoding: {sys.getdefaultencoding()}')"
      env:
        # Fix encoding issues on all platforms
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1
        LC_ALL: en_US.UTF-8
        LANG: en_US.UTF-8

    - name: Check formatting and linting with ruff
      run: |
        ruff check .
        ruff format --check .
      env:
        # Fix encoding issues on all platforms
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1
        LC_ALL: en_US.UTF-8
        LANG: en_US.UTF-8

    - name: Type checking with mypy
      run: |
        mypy xc8_wrapper --ignore-missing-imports
      env:
        # Fix encoding issues on all platforms
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1
        LC_ALL: en_US.UTF-8
        LANG: en_US.UTF-8

    - name: Test with pytest
      run: |
        pytest --cov=xc8_wrapper --cov-report=xml --cov-report=term-missing -m "not slow and not compilation"
      env:
        # Fix encoding issues on all platforms
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1
        LC_ALL: en_US.UTF-8
        LANG: en_US.UTF-8

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Check for security vulnerabilities in dependencies
      run: |
        safety check

    - name: Run bandit security linter
      run: |
        bandit -r xc8_wrapper/

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
