name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows first (primary development platform), then Linux, then macOS
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Reduce the matrix size by excluding some combinations
          - os: macos-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.9'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Check formatting with black
      run: |
        black --check --diff .
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Sort imports with isort
      run: |
        isort --check-only --diff .
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Type checking with mypy
      run: |
        mypy xc8_wrapper --ignore-missing-imports
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Test with pytest
      run: |
        pytest --cov=xc8_wrapper --cov-report=xml --cov-report=term-missing
      env:
        # Fix encoding issues on Windows
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: 1

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Check for security vulnerabilities in dependencies
      run: |
        safety check

    - name: Run bandit security linter
      run: |
        bandit -r xc8_wrapper/

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/
